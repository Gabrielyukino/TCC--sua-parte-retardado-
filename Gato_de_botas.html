<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro Infantil - João e o Pé de Feijão</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f0f0;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:15px;
}

.livro{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:100%;
}

.pagina{
    width:100%;
    max-width:900px;
    background:#cf7318;
    border-radius:30px;
    padding:25px;
    display:flex;
    gap:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

#imagemLivro{
    width:50%;
    max-height:400px;
    object-fit:cover;
    border-radius:20px;
}

.texto{
    width:50%;
}

.texto h1{
    margin-bottom:15px;
    font-size:32px;
    color:#3b2f1f;
}

.texto p{
    font-size:22px;
    line-height:1.6;
    color:#3b2f1f;
}

.numero-pagina{
    margin-top:20px;
    font-size:15px;
    color:#555;
}

.controles{
    display:flex;
    gap:20px;
}

.seta{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    background:#f7b166;
    color:white;
    font-size:32px;
    cursor:pointer;
    transition:0.3s;
}

.seta:hover{
    transform:scale(1.1);
}

/* CELULAR */
@media (max-width:768px){

    .pagina{
        flex-direction:column;
        padding:20px;
    }

    #imagemLivro{
        width:100%;
        max-height:250px;
    }

    .texto{
        width:100%;
    }

    .texto h1{
        text-align:center;
        font-size:26px;
    }

    .texto p{
        font-size:18px;
    }

    .seta{
        width:60px;
        height:60px;
        font-size:28px;
    }
}
</style>
</head>
<body>
    <button onclick="window.close()">Voltar</button>

<div class="livro">

    <div class="pagina">

        <img id="imagemLivro" src="" alt="Imagem do Livro">

        <div class="texto">
            <h1 id="titulo"></h1>
            <p id="conteudo"></p>
            <div class="numero-pagina" id="numeroPagina"></div>
        </div>

    </div>

    <div class="controles">
        <button class="seta" onclick="paginaAnterior()">⬅</button>
        <button class="seta" onclick="proximaPagina()">➡</button>
    </div>

</div>

<script>

const paginas = [

{
    titulo: "Gato de Botas",
    imagem: "https://i.imgur.com/G1bYO9P.jpeg",
    conteudo: "Um rapaz pobre recebeu apenas um gato de herança. O gato pediu um par de botas e um saco para ajudar seu dono a mudar de vida."
},

{
    titulo: "Página 2",
    imagem: "https://i.imgur.com/pUmxxAG.jpeg",
    conteudo: "O gato foi à floresta, conseguiu alguns animais e levou os presentes ao rei. Ele disse que eram do Marquês de Carabás, fazendo seu dono parecer rico e importante."
},

{
    titulo: "Página 3",
    imagem: "https://i.imgur.com/eKWlIDR.jpeg",
    conteudo: "O gato descobriu um grande castelo de um ogro. Com sua esperteza, enganou o ogro, que se transformou em um pequeno ratinho, e então ficou com o castelo."
},

{
    titulo: "Página 4",
    imagem: "https://i.imgur.com/N2aI596.jpeg",
    conteudo: "O rei ficou impressionado com o castelo e acreditou que ele pertencia ao Marquês de Carabás. No fim, o rapaz ficou rico, casou-se com a princesa e viveu feliz com seu esperto Gato de Botas"
}

];

let paginaAtual = 0;

function atualizarPagina(){

    document.getElementById("titulo").textContent =
        paginas[paginaAtual].titulo;

    document.getElementById("conteudo").textContent =
        paginas[paginaAtual].conteudo;

    document.getElementById("imagemLivro").src =
        paginas[paginaAtual].imagem;

    document.getElementById("numeroPagina").textContent =
        `Página ${paginaAtual + 1} de ${paginas.length}`;
}

function proximaPagina(){

    if(paginaAtual < paginas.length - 1){
        paginaAtual++;
        atualizarPagina();
    }
}

function paginaAnterior(){

    if(paginaAtual > 0){
        paginaAtual--;
        atualizarPagina();
    }
}

atualizarPagina();

</script>

</body>
</html>
