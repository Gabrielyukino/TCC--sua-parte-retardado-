    <title>Primeiras páginas</title>
    <head>
        <style>
            body {
              /* Caminho da imagem (local ou link da internet) */
              background-image: url("aaaaaaaaaaaaaaa.jpg");
              
              /* Ajustes essenciais para a imagem ficar perfeita */
              background-size: cover;       /* Cobre toda a tela sem distorcer */
              background-position: center;  /* Centraliza o foco da imagem */
              background-repeat: no-repeat; /* Impede que a imagem se repita */
              min-height: 100vh;            /* Garante que o fundo ocupe 100% da altura da tela */
              margin: 0;                    /* Remove bordas brancas padrão do navegador */
            }
          </style>
    <style>
        /* Estilo do cabeçalho onde a logo vai ficar */
        .header-container {
            display: flex;
            align-items: center; /* Alinha a logo verticalmente no centro */
            justify-content: space-between; /* Distribui a logo e o menu nos cantos */
            padding: 20px 40px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
         /* Container específico da logo */
         .logo-box {
            display: flex;
            align-items: center;
        }

        /* Configuração da imagem da logo */
        .logo-box img {
            max-height: 60px; /* Define uma altura máxima para a logo não quebrar o layout */
            width: auto; /* Mantém a proporção correta da imagem */
            object-fit: contain;
        }
        /* Apenas um exemplo de menu para contextualizar o espaço */
        .menu-exemplo a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
            font-family: sans-serif;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiras páginas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 15rem; /* ~240px */
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .card-title {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
            text-align: center;
        }

        .card-button {
            display: block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .card-button:hover {
            background-color: #0056b3;
        }
        /* Configuração e Zera Margens */
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 }

 /* Estilo do Cabeçalho */
 .header-minimal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    background-color: #ffffff;
    border-bottom: 1px solid #eaeaea;
 }

 .logo {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 1px;
 }

 .nav-links {
    display: flex;
    align-items: center;
    list-style: none;
    gap: 30px;
 }

 .nav-links a {
    text-decoration: none;
    color: #666666;
    font-size: 16px;
    font-weight: 500;
    transition: color 0.3s ease;
 }

 /* Efeito ao passar o mouse nos links */
 .nav-links a:hover {
    color: #000000;
 }

 /* Botão de Destaque (CTA) */
 .nav-links .btn-cta {
    background-color: #1a1a1a;
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 5px;
    transition: background 0.3s ease;
 }

 .nav-links .btn-cta:hover {
    background-color: #444444;
    color: #ffffff;
 }

    </style>
