<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro Infantil - João e o Pé de Feijão</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f0f0;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:15px;
}

.livro{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:100%;
}

.pagina{
    width:100%;
    max-width:900px;
    background:#c7ff7d;
    border-radius:30px;
    padding:25px;
    display:flex;
    gap:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

#imagemLivro{
    width:50%;
    max-height:400px;
    object-fit:cover;
    border-radius:20px;
}

.texto{
    width:50%;
}

.texto h1{
    margin-bottom:15px;
    font-size:32px;
    color:#3b2f1f;
}

.texto p{
    font-size:22px;
    line-height:1.6;
    color:#3b2f1f;
}

.numero-pagina{
    margin-top:20px;
    font-size:15px;
    color:#555;
}

.controles{
    display:flex;
    gap:20px;
}

.seta{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    background:#886e53;
    color:white;
    font-size:32px;
    cursor:pointer;
    transition:0.3s;
}

.seta:hover{
    transform:scale(1.1);
}

/* CELULAR */
@media (max-width:768px){

    .pagina{
        flex-direction:column;
        padding:20px;
    }

    #imagemLivro{
        width:100%;
        max-height:250px;
    }

    .texto{
        width:100%;
    }

    .texto h1{
        text-align:center;
        font-size:26px;
    }

    .texto p{
        font-size:18px;
    }

    .seta{
        width:60px;
        height:60px;
        font-size:28px;
    }
}

/* ===== MELHORIAS VISUAIS E ANIMAÇÕES ===== */
.pagina {
    align-items: center;
    overflow: hidden;
    animation: aparecerPagina .7s ease both;
}
.coluna-imagem {
    width: 50%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    flex-shrink: 0;
}
#imagemLivro {
    display: block;
    width: 100%;
    transition: transform .25s ease, filter .25s ease;
    transform-origin: center;
}
#imagemLivro:hover { transform: scale(1.025); filter: brightness(1.06); }
.texto { min-width: 0; }
.texto h1 { animation: textoEntrando .65s .08s both; }
.texto p { animation: textoEntrando .75s .16s both; }
.numero-pagina { animation: textoEntrando .8s .24s both; }
.pagina.animar .coluna-imagem { animation: imagemEntrando .25s ease both; }
.pagina.animar .texto h1 { animation: textoEntrando .55s .10s both; }
.pagina.animar .texto p { animation: textoEntrando .65s .18s both; }
.pagina.animar .numero-pagina { animation: textoEntrando .7s .25s both; }
.botao-inicio {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 11px 20px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #303030;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(0,0,0,.13);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.botao-inicio:hover {
    transform: translateY(-3px);
    background: #fff;
    box-shadow: 0 8px 18px rgba(0,0,0,.18);
}
.botao-inicio:active { transform: scale(.96); }
.seta { transition: transform .25s ease, filter .25s ease, box-shadow .25s ease; }
.seta:hover { transform: translateY(-4px) scale(1.08); filter: brightness(1.08); box-shadow: 0 8px 16px rgba(0,0,0,.18); }
.seta:active { transform: scale(.92); }
.seta:disabled { opacity: .4; cursor: not-allowed; transform: none; }
@keyframes aparecerPagina { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes imagemEntrando { from { opacity: 0; transform: translateX(-22px) scale(.97); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes textoEntrando { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width:768px) {
    .coluna-imagem { width: 100%; align-items: center; }
    #imagemLivro { width: 100%; }
    .botao-inicio { align-self: center; }
    .pagina.animar .coluna-imagem { animation-name: imagemEntrandoMobile; }
}
@keyframes imagemEntrandoMobile { from { opacity: 0; transform: translateY(-15px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
    

<div class="livro">

    <div class="pagina">

        <div class="coluna-imagem">
            <img id="imagemLivro" src="" alt="Ilustração da história">
            <a class="botao-inicio" href="index.html" aria-label="Voltar para a página inicial">⌂ <span>Voltar ao início</span></a>
        </div>

        <div class="texto">
            <h1 id="titulo"></h1>
            <p id="conteudo"></p>
            <div class="numero-pagina" id="numeroPagina"></div>
        </div>

    </div>

    <div class="controles">
        <button class="seta" onclick="paginaAnterior()">⬅</button>
        <button class="seta" onclick="proximaPagina()">➡</button>
    </div>

</div>

<script>

const paginas = [

{
    titulo: "João e o Pé de Feijão",
    imagem: "https://i.imgur.com/IDtajL2.jpeg",
    conteudo: "João e sua mãe passavam por dificuldades e precisavam vender sua última vaca para conseguir dinheiro. No caminho para a cidade, o menino troca o animal com um homem misterioso por feijões que prometem ser mágicos."
},

{
    titulo: "Página 2",
    imagem: "https://i.imgur.com/c5wApRM.jpeg",
    conteudo: "Irritada com a troca, a mãe joga os feijões pela janela. Durante a noite, os grãos brotam e um pé de feijão gigante cresce até o céu, que João decide escalar na manhã seguinte."
},

{
    titulo: "Página 3",
    imagem: "https://i.imgur.com/F4DIIMX.png",
    conteudo: "No topo da planta, João descobre um castelo nas nuvens onde mora um gigante malvado. Escondido com a ajuda de uma empregada, o garoto observa os tesouros do monstro e decide roubar sua galinha dos ovos de ouro e sua harpa mágica."
},

{
    titulo: "Página 4",
    imagem: "https://i.imgur.com/MuADelK.jpeg",
    conteudo: "O gigante acorda e persegue João até o pé de feijão. Ao chegar ao chão, o menino corta o tronco, fazendo o gigante ficar preso lá em cima, o que garante uma vida rica e feliz para João e sua mãe."
}

];

let paginaAtual = 0;

function atualizarPagina(){
    const painel = document.querySelector('.pagina');
    painel.classList.remove('animar');
    void painel.offsetWidth; // Reinicia a animação a cada troca de página.
    painel.classList.add('animar');

    document.getElementById("titulo").textContent =
        paginas[paginaAtual].titulo;

    document.getElementById("conteudo").textContent =
        paginas[paginaAtual].conteudo;

    document.getElementById("imagemLivro").src =
        paginas[paginaAtual].imagem;

    document.getElementById("numeroPagina").textContent =
        `Página ${paginaAtual + 1} de ${paginas.length}`;
    const botoes = document.querySelectorAll('.controles .seta');
    if (botoes.length >= 2) {
        botoes[0].disabled = paginaAtual === 0;
        botoes[1].disabled = paginaAtual === paginas.length - 1;
    }
}

function proximaPagina(){

    if(paginaAtual < paginas.length - 1){
        paginaAtual++;
        atualizarPagina();
    }
}

function paginaAnterior(){

    if(paginaAtual > 0){
        paginaAtual--;
        atualizarPagina();
    }
}

atualizarPagina();

</script>

</body>
</html>
