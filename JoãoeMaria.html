<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro Infantil - João e Maria</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f0f0;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding: 15px;
}

.livro{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap:20px;
    width: 100%;
    max-width: 900px;
}

.pagina{
    width:100%;
    min-height:500px;
    background:#fa93cc;
    border-radius:30px;
    padding:25px;
    display:flex;
    flex-direction: row;
    gap:30px;
    align-items: center;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
}

#imagemLivro{
    width:50%;
    max-height:400px;
    object-fit:cover;
    border-radius:20px;
}

.texto{
    width:50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.texto h1{
    margin-bottom:15px;
    font-size:32px;
    color: #333;
}

.texto p{
    font-size:18px;
    line-height:1.5;
    color: #444;
}

.numero-pagina{
    margin-top:20px;
    font-size:14px;
    color:#555;
    font-weight: bold;
}

.controles {
    display: flex;
    gap: 30px;
    justify-content: center;
    width: 100%;
}

.seta{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    background:#fc6279;
    font-size:32px;
    cursor:pointer;
    transition:0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.seta:active {
    transform: scale(0.9);
}

/* 📱 ADAPTAÇÃO PARA CELULARES (Telas menores que 768px) */
@media (max-width: 768px) {
    .pagina {
        flex-direction: column; /* Transforma o layout em vertical */
        min-height: auto;
        padding: 20px;
        gap: 20px;
    }

    #imagemLivro {
        width: 100%; /* Imagem ocupa a largura total no celular */
        max-height: 250px;
    }

    .texto {
        width: 100%; /* Texto ocupa a largura total no celular */
        text-align: center;
    }

    .texto h1 {
        font-size: 24px;
        margin-bottom: 10px;
    }

    .texto p {
        font-size: 16px;
    }
    
    .seta {
        width: 60px;
        height: 60px;
        font-size: 26px;
    }
}

/* ===== MELHORIAS VISUAIS E ANIMAÇÕES ===== */
.pagina {
    align-items: center;
    overflow: hidden;
    animation: aparecerPagina .7s ease both;
}
.coluna-imagem {
    width: 50%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    flex-shrink: 0;
}
#imagemLivro {
    display: block;
    width: 100%;
    transition: transform .55s ease, filter .55s ease;
    transform-origin: center;
}
#imagemLivro:hover { transform: scale(1.025); filter: brightness(1.06); }
.texto { min-width: 0; }
.texto h1 { animation: textoEntrando .65s .08s both; }
.texto p { animation: textoEntrando .75s .16s both; }
.numero-pagina { animation: textoEntrando .8s .24s both; }
.pagina.animar .coluna-imagem { animation: imagemEntrando .65s ease both; }
.pagina.animar .texto h1 { animation: textoEntrando .55s .10s both; }
.pagina.animar .texto p { animation: textoEntrando .65s .18s both; }
.pagina.animar .numero-pagina { animation: textoEntrando .7s .25s both; }
.botao-inicio {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 11px 20px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: #303030;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(0,0,0,.13);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.botao-inicio:hover {
    transform: translateY(-3px);
    background: #fff;
    box-shadow: 0 8px 18px rgba(0,0,0,.18);
}
.botao-inicio:active { transform: scale(.96); }
.seta { transition: transform .25s ease, filter .25s ease, box-shadow .25s ease; }
.seta:hover { transform: translateY(-4px) scale(1.08); filter: brightness(1.08); box-shadow: 0 8px 16px rgba(0,0,0,.18); }
.seta:active { transform: scale(.92); }
.seta:disabled { opacity: .4; cursor: not-allowed; transform: none; }
@keyframes aparecerPagina { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes imagemEntrando { from { opacity: 0; transform: translateX(-22px) scale(.97); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes textoEntrando { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width:768px) {
    .coluna-imagem { width: 100%; align-items: center; }
    #imagemLivro { width: 100%; }
    .botao-inicio { align-self: center; }
    .pagina.animar .coluna-imagem { animation-name: imagemEntrandoMobile; }
}
@keyframes imagemEntrandoMobile { from { opacity: 0; transform: translateY(-15px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
    

<div class="livro">

    <div class="pagina">
        <div class="coluna-imagem">
            <img id="imagemLivro" src="" alt="Ilustração da história">
            <a class="botao-inicio" href="index.html" aria-label="Voltar para a página inicial">⌂ <span>Voltar ao início</span></a>
        </div>

        <div class="texto">
            <h1 id="titulo"></h1>
            <p id="conteudo"></p>
            <div class="numero-pagina" id="numeroPagina"></div>
        </div>
    </div>

    <!-- Botões agrupados abaixo do livro para melhor usabilidade no celular -->
    <div class="controles">
        <button class="seta" onclick="paginaAnterior()">⬅</button>
        <button class="seta" onclick="proximaPagina()">➡</button>
    </div>

</div>

<script>

const paginas = [
    {
        titulo: "João e Maria",
        imagem: "https://i.imgur.com/f9IdwOR.jpeg",
        conteudo: "João e Maria são abandonados na floresta pela madrasta e pelo pai devido à extrema pobreza. Na primeira tentativa, João usa pedrinhas brilhantes para marcar o caminho e eles conseguem voltar para casa."
    },
    {
        titulo: "Página 2",
        imagem: "https://i.imgur.com/Qhedz68.jpeg",
        conteudo: "Na segunda vez, impedido de pegar as pedras, João usa migalhas de pão. Os pássaros comem as migalhas, deixando os irmãos perdidos, famintos e exaustos na mata."
    },
    {
        titulo: "Página 3",
        imagem: "https://i.imgur.com/gNqshCi.png",
        conteudo: "Eles encontram uma casa feita de doces e são acolhidos por uma idosa que, na verdade, é uma bruxa canibal. Ela prende João em uma gaiola para engordá-lo e força Maria a fazer os trabalhos domésticos."
    },
    {
        titulo: "Página 4",
        imagem: "https://i.imgur.com/xlvYJiR.png",
        conteudo: "Após semanas enganando a bruxa, ela decide assar João. Espertamente, Maria empurra a bruxa para dentro do forno aceso. Os irmãos libertam-se, pegam os tesouros da casa e encontram o caminho de volta para o pai, que os recebe com alegria e sem a madrasta má."
    }
];

let paginaAtual = 0;

function atualizarPagina(){
    const painel = document.querySelector('.pagina');
    painel.classList.remove('animar');
    void painel.offsetWidth; // Reinicia a animação a cada troca de página.
    painel.classList.add('animar');
    document.getElementById("titulo").textContent = paginas[paginaAtual].titulo;
    document.getElementById("conteudo").textContent = paginas[paginaAtual].conteudo;
    document.getElementById("imagemLivro").src = paginas[paginaAtual].imagem;
    document.getElementById("numeroPagina").textContent = `Página ${paginaAtual + 1} de ${paginas.length}`;
    const botoes = document.querySelectorAll('.controles .seta');
    if (botoes.length >= 2) {
        botoes[0].disabled = paginaAtual === 0;
        botoes[1].disabled = paginaAtual === paginas.length - 1;
    }
    
    // Rola a página para o topo suavemente ao mudar de página (bom para telas pequenas)
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function proximaPagina(){
    if(paginaAtual < paginas.length - 1){
        paginaAtual++;
        atualizarPagina();
    }
}

function paginaAnterior(){
    if(paginaAtual > 0){
        paginaAtual--;
        atualizarPagina();
    }
}

atualizarPagina();

</script>

</body>
</html>
