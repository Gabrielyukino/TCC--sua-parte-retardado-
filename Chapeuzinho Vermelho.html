<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro Infantil - Chapeuzinho Vermelho</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f0f0;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:15px;
}

.livro{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    width:100%;
}

.pagina{
    width:100%;
    max-width:900px;
    background:#ff6363;
    border-radius:30px;
    padding:25px;
    display:flex;
    gap:25px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

#imagemLivro{
    width:50%;
    max-height:400px;
    object-fit:cover;
    border-radius:20px;
}

.texto{
    width:50%;
}

.texto h1{
    margin-bottom:15px;
    font-size:32px;
    color:rgb(0, 0, 0);
}

.texto p{
    font-size:22px;
    line-height:1.6;
    color:rgb(0, 0, 0);
}

.numero-pagina{
    margin-top:20px;
    font-size:15px;
    color:#000000;
}

.controles{
    display:flex;
    gap:20px;
}

.seta{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    background:#aeaeae;
    font-size:32px;
    cursor:pointer;
    transition:0.3s;
}

.seta:hover{
    transform:scale(1.1);
}

/* CELULAR */
@media (max-width:768px){

    .pagina{
        flex-direction:column;
        padding:20px;
    }

    #imagemLivro{
        width:100%;
        max-height:250px;
    }

    .texto{
        width:100%;
    }

    .texto h1{
        text-align:center;
        font-size:26px;
    }

    .texto p{
        font-size:18px;
    }

    .seta{
        width:60px;
        height:60px;
        font-size:28px;
    }
}
</style>
</head>
<body>
    <button onclick="window.close()">Voltar</button>

<div class="livro">

    <div class="pagina">

        <img id="imagemLivro" src="" alt="Imagem do Livro">

        <div class="texto">
            <h1 id="titulo"></h1>
            <p id="conteudo"></p>
            <div class="numero-pagina" id="numeroPagina"></div>
        </div>

    </div>

    <div class="controles">
        <button class="seta" onclick="paginaAnterior()">⬅</button>
        <button class="seta" onclick="proximaPagina()">➡</button>
    </div>

</div>

<script>

const paginas = [

{
    titulo: "Chapeuzinho Vermelho",
    imagem: "https://i.imgur.com/XeM3Boe.jpeg",
    conteudo: "Chapeuzinho Vermelho desobedece a mãe ao conversar com um lobo na floresta a caminho da casa de sua avó doente."
},

{
    titulo: "Página 2",
    imagem: "https://i.imgur.com/Pgi1Nrj.jpeg",
    conteudo: "O lobo engana a menina para ela colher flores, corre até a casa, prende a avó no armário e se disfarça na cama."
},

{
    titulo: "Página 3",
    imagem: "https://i.imgur.com/6V2u9XF.jpeg",
    conteudo: "A menina chega, estranha as feições grandes da avó no famoso diálogo e descobre o lobo, que tenta capturá-la."
},

{
    titulo: "Página 4",
    imagem: "https://i.imgur.com/S02VKSh.jpeg",
    conteudo: "Um caçador ouve a confusão, salva a avó de dentro do armário e assusta o animal que volta á floresta."
}

];

let paginaAtual = 0;

function atualizarPagina(){

    document.getElementById("titulo").textContent =
        paginas[paginaAtual].titulo;

    document.getElementById("conteudo").textContent =
        paginas[paginaAtual].conteudo;

    document.getElementById("imagemLivro").src =
        paginas[paginaAtual].imagem;

    document.getElementById("numeroPagina").textContent =
        `Página ${paginaAtual + 1} de ${paginas.length}`;
}

function proximaPagina(){

    if(paginaAtual < paginas.length - 1){
        paginaAtual++;
        atualizarPagina();
    }
}

function paginaAnterior(){

    if(paginaAtual > 0){
        paginaAtual--;
        atualizarPagina();
    }
}

atualizarPagina();

</script>

</body>
</html>
